<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Brand fonts, loaded once at the document level. Views used to inject
         their own <link>, so any screen that forgot one (the sign-in modal, for
         instance) fell back to Georgia and the Attune wordmark rendered in the
         wrong face. Covers every weight the app asks for: Playfair Display
         (display + wordmark), DM Sans (body), Syne (results headings). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />
    <script>
    /* attune:err-capture — records uncaught errors + failed resource loads to
       localStorage so intermittent blank-screen crashes can be diagnosed after
       the fact. Installed before the app bundle so it also catches load failures. */
    (function(){
      try{
        var KEY='attune_err_log';
        function rec(o){try{var L=JSON.parse(localStorage.getItem(KEY)||'[]');L.push(Object.assign({t:new Date().toISOString(),url:location.href},o));localStorage.setItem(KEY,JSON.stringify(L.slice(-25)));}catch(e){}}
        window.addEventListener('error',function(e){
          if(e&&e.target&&e.target!==window&&(e.target.src||e.target.href)){rec({kind:'resource',msg:(e.target.tagName||'')+' load failed',src:e.target.src||e.target.href});}
          else{rec({kind:'error',msg:(e&&e.message)||'unknown',stack:(e&&e.error&&e.error.stack)?String(e.error.stack).slice(0,1200):''});}
        },true);
        window.addEventListener('unhandledrejection',function(e){var r=e&&e.reason;rec({kind:'promise',msg:(r&&(r.message||String(r)))||'unhandledrejection',stack:(r&&r.stack)?String(r.stack).slice(0,1200):''});});
      }catch(e){}
    })();
    /* Capture the Supabase email-confirmation type from the URL hash before the
       app bundle initializes (detectSessionInUrl consumes the hash on load). */
    try { window.__attuneConfirmType = new URLSearchParams((location.hash || '').replace(/^#/, '')).get('type') || ''; } catch (e) { window.__attuneConfirmType = ''; }
    </script>
    <script>
    /* attune:blank-guard — last-resort recovery so a failed load never leaves a
       blank page. Runs independently of the app bundle, so it works even when
       the bundle itself fails to load (the React error boundary can't, because
       React never started).

       Layer 1 — chunk/module recovery: right after a deploy, an already-loaded
       page can reference an asset hash the new build replaced. The failed import
       triggers ONE automatic reload to fetch the current build. A sessionStorage
       guard prevents a reload loop; the guard is cleared the moment the app
       mounts, so a future deploy can recover again.

       Layer 2 — blank fallback: if nothing has mounted into #root after a grace
       period, show an on-brand card with a Reload button instead of a white
       screen. */
    (function () {
      var RELOAD_KEY = 'attune_blank_reloaded';
      function isChunkError(msg) {
        return /dynamically imported module|Importing a module script failed|error loading dynamically imported|Failed to fetch dynamically|ChunkLoadError|Loading chunk|Loading CSS chunk/i.test(String(msg || ''));
      }
      function mounted() {
        var r = document.getElementById('root');
        return !!(r && r.childElementCount > 0);
      }
      function reloadOnce() {
        try {
          if (sessionStorage.getItem(RELOAD_KEY)) return; // already tried — don't loop
          sessionStorage.setItem(RELOAD_KEY, '1');
          location.reload();
        } catch (e) {}
      }
      // Layer 1: auto-recover from a JS/CSS chunk that failed to load.
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          var url = t.src || t.href || '';
          if (/\/assets\/|\.m?js(\?|$)|\.css(\?|$)/i.test(url)) reloadOnce();
        } else if (e && isChunkError(e.message)) {
          reloadOnce();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        if (isChunkError(r && (r.message || r))) reloadOnce();
      });
      // Layer 2: show a fallback if the app never paints.
      function showFallback() {
        if (mounted() || document.getElementById('attune-blank-fallback')) return;
        var d = document.createElement('div');
        d.id = 'attune-blank-fallback';
        d.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem;background:#F3EDE6;font-family:system-ui,-apple-system,sans-serif;';
        d.innerHTML = '<div style="background:#FFFDF9;border-radius:20px;padding:2.5rem 2rem;max-width:400px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(14,11,7,0.1);">'
          + '<div style="font-size:1.2rem;font-weight:700;color:#0E0B07;margin-bottom:0.5rem;line-height:1.3;">This is taking longer than it should.</div>'
          + '<p style="font-size:0.88rem;color:#8C7A68;line-height:1.6;margin:0 0 1.5rem;">A new version may have just shipped. Reload to get the latest. Your progress is saved.</p>'
          + '<button id="attune-blank-reload" style="background:linear-gradient(135deg,#E8673A,#1B5FE8);color:#fff;border:none;padding:0.75rem 1.6rem;font-size:0.85rem;font-weight:700;border-radius:10px;cursor:pointer;font-family:inherit;">Reload</button>'
          + '</div>';
        document.body.appendChild(d);
        var btn = document.getElementById('attune-blank-reload');
        if (btn) btn.onclick = function () { try { sessionStorage.removeItem(RELOAD_KEY); } catch (e) {} location.reload(); };
      }
      function onReady() {
        // The moment React paints into #root: clear the reload guard (so future
        // deploys can recover) and remove any fallback already shown.
        try {
          var mo = new MutationObserver(function () {
            if (mounted()) {
              try { sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}
              var fb = document.getElementById('attune-blank-fallback'); if (fb) fb.remove();
              mo.disconnect();
            }
          });
          mo.observe(document.getElementById('root'), { childList: true });
        } catch (e) {}
        // If still blank after the grace period, paint the fallback.
        setTimeout(showFallback, 9000);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', onReady);
      else onReady();
    })();
    </script>
  <!-- attune:hscroll-lock -->
  <style>
    html { overscroll-behavior-x: none; overflow-x: hidden; max-width: 100%; }
    body { overflow-x: hidden; max-width: 100%; }
  </style>

    <title>Attune</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Attune">
  <meta name="theme-color" content="#0E0B07">
  <meta name="robots" content="noindex,nofollow">
  <style>
    html,body{overflow-x:hidden;max-width:100%;position:relative}
    /* iOS auto-zooms inputs smaller than 16px. Force 16px on mobile across the app
       to prevent jarring zoom when testers tap any field. */
    @media(max-width:780px){
      input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]),
      textarea,
      select{
        font-size:16px!important;
      }
    }
  </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
