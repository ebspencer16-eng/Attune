<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attune – Your experience</title>
  <!-- attune:hscroll-lock -->
  <link rel="stylesheet" href="/tokens.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overscroll-behavior-x:none;overflow-x:hidden;max-width:100%;width:100%;scroll-behavior:smooth}
body{overflow-x:hidden;max-width:100%;width:100%;position:relative}
:root{
  --cream:#F7F4EE;--warm:#FDFCF9;--ink:#1C1A16;--soft:#5A5750;--faint:#6D6A65;
  --orange:#E8673A;--indigo:#1B5FE8;
  --border:rgba(28,26,22,.12);--border-soft:rgba(28,26,22,.07);
  --orange-light:rgba(232,103,58,.1);
}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;line-height:1.6;min-height:100vh}
.page{max-width:660px;margin:0 auto;padding:1.98rem var(--s-xl) 6rem}

.header{margin-bottom:var(--s-2xl)}
.header-eyebrow{font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:var(--s-md);display:flex;align-items:center;gap:var(--s-xs)}
.header-eyebrow::before,.header-eyebrow::after{content:'';width:20px;height:1.5px;flex-shrink:0}
.header-eyebrow::before{background:linear-gradient(90deg,var(--orange),var(--indigo))}
.header-eyebrow::after{background:linear-gradient(90deg,var(--indigo),var(--orange))}
.header h1{font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,5vw,2.5rem);font-weight:400;line-height:1.15;margin-bottom:.85rem;color:var(--ink)}
.header p{font-size:.9rem;color:var(--soft);line-height:1.75;max-width:500px}

.progress-wrap{margin-bottom:var(--s-2xl)}
.progress-meta{display:flex;justify-content:space-between;font-size:.7rem;color:var(--faint);margin-bottom:6px}
.progress-track{height:2px;background:var(--border);border-radius:2px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--indigo));border-radius:2px;transition:width .5s ease;width:0%}

.question{margin-bottom:2.1rem}
.q-text{font-family:'DM Serif Display',serif;font-size:1.05rem;font-weight:400;line-height:1.45;margin-bottom:.75rem;color:var(--ink)}
.q-hint{font-size:.78rem;color:var(--faint);margin:-.45rem 0 .8rem;line-height:1.5}

/* Stars */
.stars{display:flex;gap:.5rem}
.star{background:none;border:none;padding:2px 0;font-size:1.9rem;line-height:1;color:var(--border);cursor:pointer;transition:color .15s;font-family:inherit}
.star.on{color:var(--orange)}

/* Chips, used for the choice, the scale and the ranking's options */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 15px;border:1px solid var(--border);border-radius:100px;background:var(--warm);font-size:.82rem;font-family:'DM Sans',sans-serif;color:var(--soft);cursor:pointer;transition:all .15s;line-height:1.3;text-align:left}
.chip:hover{border-color:var(--soft);color:var(--ink)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:white}

/* NPS */
.nps-row{display:flex;gap:5px;flex-wrap:wrap}
.nps-btn{width:44px;height:44px;border:1px solid var(--border);border-radius:7px;background:var(--warm);font-size:.88rem;font-family:'DM Sans',sans-serif;color:var(--soft);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.nps-btn:hover{border-color:var(--orange);color:var(--orange)}
.nps-btn.sel{background:var(--orange);border-color:var(--orange);color:white;font-weight:600}
.nps-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:.68rem;color:var(--faint)}

/* Rank: picked rows stack in order, the rest wait below */
.rank-picked{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.9rem}
.rank-rest{display:flex;flex-direction:column;gap:.4rem}
.rank-row{display:flex;align-items:center;gap:.7rem;width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--warm);font-size:.85rem;font-family:'DM Sans',sans-serif;color:var(--ink);cursor:pointer;text-align:left;transition:all .15s}
.rank-row:hover{border-color:var(--soft)}
.rank-row.sel{background:var(--orange-light);border-color:var(--orange)}
.rank-num{width:22px;height:22px;border-radius:50%;background:var(--orange);color:white;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.rank-left{font-size:.72rem;color:var(--faint);margin-top:.7rem}

textarea{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:10px;background:var(--warm);font-size:.88rem;font-family:'DM Sans',sans-serif;font-weight:300;color:var(--ink);line-height:1.65;resize:vertical;min-height:90px;outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--soft)}
textarea::placeholder{color:var(--faint)}
.notice{font-size:.72rem;color:var(--faint);line-height:1.55;margin-top:.5rem}

.submit-btn{width:100%;padding:15px 24px;background:var(--ink);color:white;border:none;border-radius:10px;font-size:.95rem;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:background .2s;letter-spacing:.01em}
.submit-btn:hover{background:var(--orange)}
.submit-btn:disabled{opacity:.35;cursor:not-allowed}
.saved-line{font-size:.72rem;color:var(--faint);text-align:center;margin-top:var(--s-md)}
.warn{display:none;background:rgba(232,103,58,.08);border:1px solid rgba(232,103,58,.35);color:var(--ink);border-radius:10px;padding:.8rem var(--s-md);font-size:.82rem;line-height:1.5;margin-bottom:.9rem}
.warn.show{display:block}

.success-state{display:none;text-align:center;padding:2.64rem var(--s-2xl)}
.success-state.show{display:block}
.success-mark{width:52px;height:52px;background:rgba(16,185,129,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto var(--s-xl);font-size:1.4rem}
.success-state h2{font-family:'DM Serif Display',serif;font-size:1.75rem;font-weight:400;margin-bottom:.65rem}
.success-state p{font-size:.9rem;color:var(--soft)}

@media(max-width:500px){
  .nps-btn{width:38px;height:38px;font-size:.8rem}
}
</style>
<!-- attune:press-feedback -->
<style>
  /* Ellie: "add on the site and the web some sense of a button push". One rule
     rather than a list of controls: see index.html for the reasoning. */
  button:not(:disabled):active, a[role="button"]:active, .btn:active, [data-pressable]:active {
    transform: scale(0.985); filter: brightness(0.96);
  }
  button, a[role="button"], .btn, [data-pressable] {
    transition: transform .08s ease, filter .08s ease, opacity .12s ease;
  }
  button:disabled { cursor: default; }
  @media (prefers-reduced-motion: reduce) {
    button, a[role="button"], .btn, [data-pressable] { transition: none; }
    button:not(:disabled):active, a[role="button"]:active, .btn:active, [data-pressable]:active { transform: none; }
  }
</style>
</head>
<body>

<div class="page" id="formPage">
  <div class="header">
    <div class="header-eyebrow" id="eyebrow">Attune</div>
    <h1 id="title"></h1>
  </div>

  <div class="progress-wrap">
    <div class="progress-meta"><span id="progText"></span><span id="progPct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
  </div>

  <div id="questions"></div>

  <div class="warn" id="warn"></div>
  <button class="submit-btn" id="submitBtn" disabled></button>
  <div class="saved-line" id="savedLine"></div>
</div>

<div class="success-state" id="successState">
  <div class="success-mark">✓</div>
  <h2 id="thanksTitle"></h2>
  <p id="thanksBody"></p>
</div>

<script src="/_session.js"></script>
<script>
/**
 * The survey, for somebody arriving from a link.
 *
 * ── THE QUESTIONS ARE NOT IN THIS FILE ────────────────────────────────────
 * This page used to carry twenty-six of its own, while the results carried six
 * and the app carried seven. Three question sets, three stores, and no way to
 * compare an answer from one with an answer from another.
 *
 * Ellie, approving the replacement: "Please use this as the regular survey for
 * everyone at the end of their experience, not just beta users."
 *
 * So everything drawn here comes from GET /api/survey: the questions, their
 * options, the wording around them, and the ranking's list, which is built out
 * of what this particular couple actually did. Nothing below is a sentence a
 * customer reads. It is the drawing of whatever the endpoint says to ask.
 *
 * ── EVERY ANSWER IS SAVED AS IT IS GIVEN ──────────────────────────────────
 * Ellie: "Collect incomplete responses." Each answer posts as it is made, so
 * closing the tab half way through leaves what was written. The old page kept
 * everything in the DOM until the submit button and threw it all away if that
 * request failed. Only reaching the end marks the response finished.
 */
(function () {
  var form = null;
  var answers = {};
  var sending = false;
  var savedOnce = false;
  var timer = null;

  var el = function (id) { return document.getElementById(id); };

  /* Should this question be asked?
   *
   * The condition is data on the question itself, from api/_lib/survey.js, so
   * this is a matcher rather than a list of question ids. A static page cannot
   * import that file, which is why these six lines exist at all; what keeps
   * them honest is check-survey, which lifts this function and runs it against
   * the server's own `shouldShow` over a sweep of answers.
   *
   * A new conditional question needs no change here. */
  function shouldShow(q, answers) {
    var w = q && q.showWhen;
    if (!w || !w.field) return true;
    var v = answers[w.field];
    if (typeof w.startsWith === 'string') {
      return typeof v === 'string' && v.indexOf(w.startsWith) === 0;
    }
    if (w.atLeast !== undefined || w.atMost !== undefined) {
      var n = Number(v);
      if (!isFinite(n) || v === '' || v === null || v === undefined) return false;
      if (w.atLeast !== undefined && n < w.atLeast) return false;
      if (w.atMost !== undefined && n > w.atMost) return false;
      return true;
    }
    return true;
  }

  function shown() {
    return form.questions.filter(function (q) { return shouldShow(q, answers); });
  }

  function answered(v) {
    if (v === null || v === undefined) return false;
    if (typeof v === 'string') return v.trim().length > 0;
    if (Array.isArray(v)) return v.length > 0;
    return true;
  }

  function save(done) {
    var payload = { answers: answers, source: 'link' };
    if (done) payload.done = true;
    return fetch('/api/survey', {
      method: 'POST',
      headers: window.attuneHeaders(),
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error('Server returned ' + res.status);
      savedOnce = true;
      el('savedLine').textContent = form.copy.saved;
      return true;
    });
  }

  /* Text answers save on a pause rather than on every character. */
  function saveSoon() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { save(false).catch(function () {}); }, 900);
  }

  function set(id, v) {
    answers[id] = v;
    render();
    save(false).catch(function () {});
  }

  function progress() {
    var qs = shown();
    var n = qs.filter(function (q) { return answered(answers[q.id]); }).length;
    var pct = qs.length ? Math.round((n / qs.length) * 100) : 0;
    el('progPct').textContent = pct + '%';
    el('progFill').style.width = pct + '%';
    el('progText').textContent = n + ' of ' + qs.length + ' answered';
    el('submitBtn').disabled = sending || n === 0;
  }

  function chip(label, on, onClick) {
    var b = document.createElement('button');
    b.className = 'chip' + (on ? ' sel' : '');
    b.type = 'button';
    b.textContent = label;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.addEventListener('click', onClick);
    return b;
  }

  function control(q) {
    var wrap = document.createElement('div');
    var cur = answers[q.id];

    if (q.kind === 'stars') {
      var max = q.max || 5;
      var row = document.createElement('div');
      row.className = 'stars';
      for (var i = 1; i <= max; i++) {
        (function (n) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'star' + (Number(cur) >= n ? ' on' : '');
          b.textContent = Number(cur) >= n ? '★' : '☆';
          b.setAttribute('aria-label', n + ' of ' + max);
          b.addEventListener('click', function () { set(q.id, n); });
          row.appendChild(b);
        })(i);
      }
      wrap.appendChild(row);
      return wrap;
    }

    if (q.kind === 'choice' || q.kind === 'scale') {
      var opts = q.kind === 'choice' ? (q.options || []) : (q.scale || []);
      var chips = document.createElement('div');
      chips.className = 'chips';
      opts.forEach(function (label, idx) {
        /* A scale stores its position, one-based, so the admin can average it.
           A choice stores the words. */
        var value = q.kind === 'scale' ? idx + 1 : label;
        chips.appendChild(chip(label, cur === value, function () {
          set(q.id, cur === value ? '' : value);
        }));
      });
      wrap.appendChild(chips);
      return wrap;
    }

    if (q.kind === 'nps') {
      var lo = q.min === undefined ? 0 : q.min;
      var hi = q.max === undefined ? 10 : q.max;
      var nrow = document.createElement('div');
      nrow.className = 'nps-row';
      for (var n2 = lo; n2 <= hi; n2++) {
        (function (n) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'nps-btn' + (cur === n ? ' sel' : '');
          b.textContent = String(n);
          b.addEventListener('click', function () { set(q.id, cur === n ? '' : n); });
          nrow.appendChild(b);
        })(n2);
      }
      wrap.appendChild(nrow);
      if (q.ends && q.ends.length === 2) {
        var labels = document.createElement('div');
        labels.className = 'nps-labels';
        var a = document.createElement('span'); a.textContent = q.ends[0];
        var b2 = document.createElement('span'); b2.textContent = q.ends[1];
        labels.appendChild(a); labels.appendChild(b2);
        wrap.appendChild(labels);
      }
      return wrap;
    }

    if (q.kind === 'rank') {
      var all = q.options || [];
      var picked = (Array.isArray(cur) ? cur : []).filter(function (o) { return all.indexOf(o) >= 0; });
      var rest = all.filter(function (o) { return picked.indexOf(o) < 0; });
      var top = document.createElement('div');
      top.className = 'rank-picked';
      picked.forEach(function (o, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'rank-row sel';
        var num = document.createElement('span');
        num.className = 'rank-num';
        num.textContent = String(i + 1);
        var txt = document.createElement('span');
        txt.textContent = o;
        b.appendChild(num); b.appendChild(txt);
        b.addEventListener('click', function () {
          set(q.id, picked.filter(function (x) { return x !== o; }));
        });
        top.appendChild(b);
      });
      var bottom = document.createElement('div');
      bottom.className = 'rank-rest';
      rest.forEach(function (o) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'rank-row';
        b.textContent = o;
        b.addEventListener('click', function () { set(q.id, picked.concat([o])); });
        bottom.appendChild(b);
      });
      if (picked.length) wrap.appendChild(top);
      wrap.appendChild(bottom);
      if (rest.length && picked.length) {
        var left = document.createElement('p');
        left.className = 'rank-left';
        left.textContent = rest.length + ' left to rank.';
        wrap.appendChild(left);
      }
      return wrap;
    }

    // text
    var ta = document.createElement('textarea');
    ta.value = typeof cur === 'string' ? cur : '';
    ta.placeholder = q.placeholder || '';
    ta.setAttribute('aria-label', q.label);
    ta.addEventListener('input', function () { answers[q.id] = ta.value; progress(); saveSoon(); });
    wrap.appendChild(ta);
    var note = document.createElement('p');
    note.className = 'notice';
    /* The one piece of fine print, and the reason the survey no longer asks
       for permission question by question: nothing published carries a name. */
    note.textContent = form.notice;
    wrap.appendChild(note);
    return wrap;
  }

  function render() {
    var host = el('questions');
    /* Redrawn whole on every answer, because showing a question depends on
       another answer. A textarea keeps focus by being left alone: it is the
       one control that is not rebuilt. */
    var focused = document.activeElement;
    var keepId = focused && focused.tagName === 'TEXTAREA' ? focused.getAttribute('aria-label') : null;
    host.textContent = '';
    shown().forEach(function (q) {
      var block = document.createElement('div');
      block.className = 'question';
      var label = document.createElement('div');
      label.className = 'q-text';
      label.textContent = q.label;
      block.appendChild(label);
      if (q.hint) {
        var hint = document.createElement('p');
        hint.className = 'q-hint';
        hint.textContent = q.hint;
        block.appendChild(hint);
      }
      block.appendChild(control(q));
      host.appendChild(block);
    });
    if (keepId) {
      var again = host.querySelector('textarea[aria-label="' + keepId.replace(/"/g, '\\"') + '"]');
      if (again) { again.focus(); again.selectionStart = again.value.length; }
    }
    progress();
  }

  function submit() {
    if (sending) return;
    sending = true;
    var btn = el('submitBtn');
    btn.disabled = true;
    btn.textContent = form.copy.submitting;
    el('warn').classList.remove('show');
    save(true).then(function () {
      try { localStorage.setItem('attune_survey_done', '1'); } catch (e) {}
      el('formPage').style.display = 'none';
      el('thanksTitle').textContent = form.copy.thanksTitle;
      el('thanksBody').textContent = form.copy.thanks;
      el('successState').classList.add('show');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }).catch(function () {
      sending = false;
      btn.disabled = false;
      btn.textContent = form.copy.submit;
      var w = el('warn');
      w.textContent = "That didn't send. Everything you answered before now is already saved. Check your connection and press it again.";
      w.classList.add('show');
      w.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  fetch('/api/survey', { headers: window.attuneHeaders() })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data.ok) throw new Error('no form');
      form = data;
      answers = data.answers || {};
      el('title').textContent = form.copy.title;
      el('submitBtn').textContent = form.copy.submit;
      el('submitBtn').addEventListener('click', submit);
      render();
    })
    .catch(function () {
      var w = el('warn');
      w.textContent = 'The survey could not load. Refresh the page and it will try again.';
      w.classList.add('show');
    });
})();
</script>
  <script src="/_flags.js"></script>
  <script src="/_track.js"></script>
</body>
</html>
