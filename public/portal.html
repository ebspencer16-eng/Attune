<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting — Attune</title>
  <script>
    /* /portal is retired. Account access, QR-card redemption, and gift setup
       all live in /app now. Forward any old links (printed cards, bookmarks)
       to the right place, mapping the old ?token= card param to /app's ?qr=. */
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var q = new URLSearchParams();
        var tok = p.get('token'); if (tok) q.set('qr', tok);              // old card param
        var tab = p.get('tab');
        if (tab === 'signup') q.set('signup', '1');
        else if (tab === 'login' || tab === 'signin') q.set('signin', '1');
        ['qr', 'gift', 'pkg', 'p1', 'p2', 'order', 'orderNum'].forEach(function (k) {
          var v = p.get(k); if (v && !q.has(k)) q.set(k, v);
        });
        var s = q.toString();
        location.replace('/app' + (s ? ('?' + s) : '') + (location.hash || ''));
      } catch (e) {
        location.replace('/app');
      }
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:3rem 1.5rem;color:#5C4A38">
  Taking you to Attune… <a href="/app">Continue</a>
</body>
</html>
