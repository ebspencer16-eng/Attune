<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Attune – Email Templates</title>
<style>
  body{margin:0;padding:0;background:#1e1a35;font-family:'Helvetica Neue',Arial,sans-serif;color:white;}
  .nav{padding:1rem 2rem;display:flex;align-items:center;gap:1rem;border-bottom:1px solid rgba(255,255,255,0.1);}
  .nav-title{font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.45);}
  .tabs{display:flex;flex-wrap:wrap;gap:0.5rem;padding:1.5rem 2rem 0;}
  .tab{padding:0.5rem 1.25rem;border-radius:8px 8px 0 0;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.12);border-bottom:none;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);transition:all .15s;}
  .tab.active{background:#F3EDE6;color:#0E0B07;border-color:#F3EDE6;}
  .preview-wrap{margin:0 2rem;border:1px solid rgba(255,255,255,0.12);border-radius:0 8px 8px 8px;overflow:hidden;}
  iframe{display:block;width:100%;border:none;background:#F3EDE6;}
  .meta{padding:1rem 2rem;font-size:0.72rem;color:rgba(255,255,255,0.35);}
  .meta strong{color:rgba(255,255,255,0.65);}
  .note{padding:0 2rem 2rem;font-size:0.72rem;line-height:1.7;color:rgba(255,255,255,0.35);max-width:46rem;}
  .tab.dead{opacity:.55;}
  .flag{margin:0 2rem 1rem;padding:.8rem 1rem;border-radius:8px;font-size:.75rem;line-height:1.6;background:rgba(232,103,58,0.12);border:1px solid rgba(232,103,58,0.3);color:#FFC9B4;}
  .fail{margin:2rem;padding:1.25rem 1.5rem;border:1px solid rgba(255,255,255,0.14);border-radius:10px;font-size:0.8rem;line-height:1.7;color:rgba(255,255,255,0.6);}
</style>
</head>
<body>
<div class="nav">
  <span style="font-size:1rem;font-weight:700;font-family:Georgia,serif;">Attune</span>
  <span class="nav-title">Email template preview</span>
</div>

<div class="tabs" id="tabs"></div>

<div class="flag" id="flag" style="display:none"></div>

<div class="preview-wrap">
  <iframe id="preview" height="760"></iframe>
</div>
<div class="meta" id="meta"></div>
<p class="note">
  Every email on this page is rendered by the code that sends it, at
  /api/email-preview. Nothing here is a mock-up. If a subject line or a
  sentence looks wrong, it is wrong in the email that goes out.
</p>

<script>
// This page used to hold its own hand-written copies of six emails, with their
// own CSS and their own wording, while the sender had ten. Five real emails
// had no preview at all, one previewed an email that module never sent, and
// the copy shown here was a second draft of the copy that shipped. It reads
// the sender now, so there is only one draft.
var LIST = '/api/email-preview';
var ONE  = '/api/email-preview?type=';

function label(type) {
  return type.replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); });
}

/**
 * ── WHY THE FRAME IS FILLED AND NOT POINTED ──────────────────────────────
 * This used to set the iframe's src to the endpoint. The site sends
 * X-Frame-Options: DENY on every path, which refuses a framed load even from
 * its own origin, so the tabs and the subject line rendered and the panel
 * under them stayed empty. That is the whole of "the preview page isn't
 * working": nothing errored, nothing logged, the frame simply had no document
 * in it.
 *
 * srcdoc is not a navigation, so the header does not apply, and the email
 * still renders in its own document with its own styles, which is the reason
 * to use a frame at all. The alternative was to weaken the header for this one
 * path, which is a worse trade for a page only Ellie and I read.
 */
function show(item, tab) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  tab.classList.add('active');
  var frame = document.getElementById('preview');
  frame.removeAttribute('src');
  frame.srcdoc = '<!doctype html><meta charset="utf-8"><body style="margin:0;font-family:sans-serif;color:#888;padding:2rem">Loading</body>';
  fetch(ONE + encodeURIComponent(item.type))
    .then(function (r) {
      if (!r.ok) throw new Error('the endpoint answered ' + r.status);
      return r.text();
    })
    .then(function (html) { frame.srcdoc = html; })
    .catch(function (e) {
      frame.srcdoc = '<!doctype html><meta charset="utf-8"><body style="margin:0;font-family:sans-serif;color:#b00;padding:2rem">'
        + 'This email could not be loaded from the sender: ' + String(e.message) + '</body>';
    });
  var sent = item.sentFrom || [];
  document.getElementById('meta').innerHTML =
    '<strong>Subject:</strong> ' + item.subject + ' &nbsp;·&nbsp; <strong>To: ' + item.to + '</strong>'
    + ' &nbsp;·&nbsp; built in ' + item.from
    + ' &nbsp;·&nbsp; sent from ' + (sent.length ? sent.join(', ') : 'nowhere');
  var flag = document.getElementById('flag');
  if (sent.length) { flag.style.display = 'none'; return; }
  flag.style.display = '';
  flag.textContent = 'Nothing sends this email. The template is here and no code asks for it, '
    + 'so no customer has received it. Worth deciding whether to bring the trigger back or take '
    + 'the template out, rather than reviewing the words.';
}

function failed(why) {
  document.querySelector('.preview-wrap').style.display = 'none';
  var d = document.createElement('div');
  d.className = 'fail';
  d.textContent = why;
  document.body.insertBefore(d, document.querySelector('.meta'));
}

fetch(LIST)
  .then(function (r) { if (!r.ok) throw new Error('the endpoint answered ' + r.status); return r.json(); })
  .then(function (list) {
    var tabs = document.getElementById('tabs');
    list.forEach(function (item, i) {
      var t = document.createElement('div');
      t.className = 'tab' + (i === 0 ? ' active' : '') + ((item.sentFrom || []).length ? '' : ' dead');
      t.textContent = label(item.type) + ((item.sentFrom || []).length ? '' : ' ·');
      t.onclick = function () { show(item, t); };
      tabs.appendChild(t);
      if (i === 0) show(item, t);
    });
  })
  .catch(function (e) {
    failed('The emails could not be loaded from the sender: ' + e.message +
           '. This page has no copies of its own, on purpose, so there is nothing to show until /api/email-preview answers. On a local vite preview there are no functions, so this is expected there.');
  });
</script>
</body>
</html>
